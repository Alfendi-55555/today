<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>역사 속 오늘</title>
  <meta name="description" content="위키백과 'On this day' 데이터로 보는 역사 속 오늘 (UTC 기준, 매일 갱신)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <p class="kicker">역사 속 오늘</p>
      <h1 id="date-title">불러오는 중…</h1>
      <p class="utc-note" id="utc-note">
        <span class="badge">UTC 기준</span>
        이 페이지의 날짜는 <strong>협정 세계시(UTC)</strong> 기준이며, 매일 00:05 UTC(한국 시간 09:05)에 갱신됩니다.
      </p>
      <p class="tz-warning" id="tz-warning" hidden></p>
    </div>
  </header>

  <nav class="tabs" aria-label="분류">
    <div class="wrap tabs-inner" role="tablist" id="tabs"></div>
  </nav>

  <main class="wrap">
    <p class="status" id="status"></p>
    <ol class="timeline" id="list"></ol>
  </main>

  <footer class="wrap footer">
    <p id="meta"></p>
    <p>
      원문 출처: <a href="https://en.wikipedia.org/wiki/Wikipedia:On_this_day/Today">영어 위키백과 On this day</a>
      (<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ko">CC BY-SA 4.0</a>).
      한국어 번역은 Gemini가 자동으로 생성해 오역이 있을 수 있습니다. 각 항목의 '원문'을 눌러 영어 원문을 확인할 수 있습니다.
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
